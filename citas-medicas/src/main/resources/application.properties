# Base de datos H2 en memoria (según enunciado: "Base de datos: H2 – libre elección")
spring.datasource.url=jdbc:h2:mem:citasmedicasdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Consola web de H2: http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:citasmedicasdb)
spring.h2.console.enabled=true

server.port=8080

# Swagger UI queda disponible en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
